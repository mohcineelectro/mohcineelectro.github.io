<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فتح التطبيق</title>
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;
min-height:100vh;align-items:center;justify-content:center;margin:0;padding:16px}
.c{max-width:420px;text-align:center}
a.b{display:block;background:#2e7d32;color:#fff;padding:16px;border-radius:12px;
text-decoration:none;font-size:20px;margin:18px 0}
code{display:block;word-break:break-all;background:#222;padding:10px;
border-radius:8px;font-size:12px;direction:ltr;text-align:left}
</style>
</head>
<body>
<div class="c">
<h2 id="t">جارٍ فتح التطبيق...</h2>
<a class="b" id="open" href="#">افتح التطبيق</a>
<p id="m"></p>
<code id="raw"></code>
</div>
<script>
(function () {
  var u = new URLSearchParams(location.search).get("u") || "";
  var ok = /^(moblin|larix|s2s):\/\//i.test(u);   // مسموح فقط بهذه التطبيقات
  var b = document.getElementById("open");
  if (!ok) {
    document.getElementById("t").textContent = "رابط غير صالح";
    b.style.display = "none";
    return;
  }
  b.href = u;
  document.getElementById("raw").textContent = u;
  document.getElementById("m").textContent =
    "إذا لم يفتح التطبيق تلقائياً اضغط الزر. تأكد أن التطبيق مثبّت، " +
    "وإذا فُتحت الصفحة داخل واتساب فاختر «فتح في المتصفح».";
  setTimeout(function () { location.href = u; }, 300);
})();
</script>
</body>
</html>
